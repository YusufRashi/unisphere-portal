# All secrets come from environment variables. There are intentionally no
# fallback values for credentials: the application fails fast if they are missing.
spring:
  application:
    name: unisphere-api
  config:
    # Local development convenience: read the repository's .env when started from ./backend.
    # Real environment variables always take precedence; in containers the file does not exist.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unisphere}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Loads lazy associations of many rows in batches instead of one query per row (N+1).
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  # Honour X-Forwarded-* from the reverse proxy (Nginx) so client IPs and scheme are correct.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

unisphere:
  app-base-url: ${APP_BASE_URL:http://localhost:5173}
  university-name: ${UNIVERSITY_NAME:UniSphere University}
  security:
    jwt:
      # Base64-encoded secret, at least 32 bytes (256 bits) after decoding.
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:unisphere}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    cookie-secure: ${COOKIE_SECURE:true}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    lockout:
      max-failed-attempts: 5
      lock-duration: 15m
    rate-limit:
      auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
    activation-token-ttl: 72h
    password-reset-token-ttl: 30m
  mail:
    # Development only, and only while no SMTP server is set: print activation / reset links to the log.
    log-links: ${MAIL_LOG_LINKS:false}
    # SMTP server for account emails. Leave MAIL_HOST empty to not send email at all.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    security: ${MAIL_SECURITY:STARTTLS}
    # Sender, e.g. "UniSphere <no-reply@university.edu>". Required when MAIL_HOST is set.
    from: ${MAIL_FROM:}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    first-name: System
    last-name: Administrator
  finance:
    currency: ${FEE_CURRENCY:KES}
  notifications:
    # Daily at 06:00 UTC. Every reminder is sent at most once, so extra or overlapping runs are harmless.
    reminder-cron: ${NOTIFICATION_REMINDER_CRON:0 0 6 * * *}
    registration-deadline-lead: 48h
    fee-reminder-interval: 14d
    # Notifications older than this are deleted by the same daily job.
    retention: ${NOTIFICATION_RETENTION:180d}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
