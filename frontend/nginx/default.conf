# Serves the SPA and proxies /api to the Spring Boot backend so the browser sees one origin.
# TLS is terminated in front of this container (load balancer / platform edge) in production.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 5m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API responses carry their own security headers (set by Spring Security).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot spoof their IP to dodge rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths return the SPA shell, which must never be cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
